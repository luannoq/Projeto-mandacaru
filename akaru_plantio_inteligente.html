                        return (
                            <button

                        </section>

                        <div className="flex flex-col gap-3">
                            {[
                                { icon: 'calendar_month', title: 'Época ideal', desc: 'Plantio recomendado entre outubro e dezembro', color: 'bg-[#C8E6C9]' },

                                { icon: 'water_drop', title: 'Irrigação', desc: 'Necessita irrigação moderada, 500mm por ciclo', color: 'bg-[#E3F2FD]', iconColor: 'text-blue-600' },
                                { icon: 'warning', title: 'Alertas de risco', desc: 'Risco de seca em janeiro — monitore a previsão', color: 'bg-warning-bg', iconColor: 'text-warning-icon', textColor: 'text-warning-text' },
                            ].map((item, idx) => (
                                <article key={idx} className={`${item.color} bg-white rounded-xl border border-surface-variant p-4 flex gap-4 items-start shadow-sm`}>

                                        <span className={`material-symbols-outlined ${item.iconColor || 'text-primary-container'}`} style={{ fontVariationSettings: "'FILL' 1" }}>{item.icon}</span>
                                    </div>
                                    <div>
                                        <h3 className="text-sm font-bold text-primary-container">{item.title}</h3>
                                        <p className={`text-sm ${item.textColor || 'text-on-surface-variant'}`}>{item.desc}</p>
                                    </div>
                                </article>
                            ))}
                        </div>

                        <div className="flex flex-col gap-3 mt-4">
                            <button className="w-full h-12 bg-primary-container text-white font-bold rounded-xl shadow-md active:scale-95 transition-all">

                { emoji: '🫘', name: 'Feijão', date: '24/05 16h40', status: 'Ideal', statusColor: 'bg-[#C8E6C9] text-[#1B4D1E]' },
                { emoji: '🍅', name: 'Tomate', date: '22/05 11h20', status: 'Risco', statusColor: 'bg-[#FFEBEE] text-[#C62828]' },
            ];

            return (
                <Layout showNav={true} title="Histórico" backPath="/home">

                                <span className="material-symbols-outlined">search</span>

                                {historyItems.map((item, idx) => (
                                    <div

                                        onClick={() => navigate('/recommendation/milho')}
                                        className="bg-white rounded-xl p-3 flex items-center justify-between border border-surface-dim active:bg-surface-container-low transition-all cursor-pointer shadow-sm"
                                    >
                                        <div className="flex items-center gap-3">
                                            <div className="w-11 h-11 bg-[#C8E6C9] flex items-center justify-center text-2xl rounded-lg shadow-inner">
                                                {item.emoji}

                                            <div className="flex flex-col">
                                                <span className="font-bold text-on-background">{item.name}</span>
                                                <span className="text-xs text-muted-gray">{item.date}</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] uppercase ${item.statusColor}`}>
                                                {item.status}
                                            </span>
                                            <span className="material-symbols-outlined text-muted-gray text-xl">chevron_right</span>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-4 p-8 bg-white border-2 border-dashed border-[#C8E6C9] rounded-xl flex flex-col items-center justify-center text-center">
                                <span className="material-symbols-outlined text-secondary text-4xl mb-2">eco</span>
                                <p className="text-xs text-muted-gray font-medium">Suas próximas análises aparecerão aqui.</p>
                            </div>
                        </section>
                    </main>
                </Layout>
            );
        };

        const ProfileScreen = () => {
            const navigate = useNavigate();
            return (
                <Layout showNav={true} title="Sobre o app" backPath="/home">
                    <main className="flex-1 px-screen-padding-h py-8 space-y-8">

                            <div className="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center mb-4 shadow-lg border-4 border-white overflow-hidden">

                            </div>

                            <p className="text-sm text-on-surface-variant italic mb-4">Plantio inteligente, colheita certa</p>
                            <span className="inline-flex bg-secondary-container text-on-secondary-container text-xs font-bold px-4 py-1.5 rounded-full">
                                v1.0.0
                            </span>
                        </section>

                        <section className="bg-white rounded-xl border border-surface-variant divide-y divide-surface-variant overflow-hidden shadow-md">

                                { icon: 'person', label: 'Desenvolvido por', value: 'Turma ADS — FIAP' },
                                { icon: 'code', label: 'Versão do build', value: '1.0.0' },
                                { icon: 'device_hub', label: 'Commit', value: '#a3f2c1', isMono: true },
                            ].map((item, idx) => (
                                <div key={idx} className="flex items-center justify-between p-4">
                                    <div className="flex items-center gap-3">
                                        <span className="material-symbols-outlined text-primary-container">{item.icon}</span>
                                        <span className="text-sm font-medium text-on-surface">{item.label}</span>
                                    </div>
                                    <span className={`text-sm text-on-surface-variant ${item.isMono ? 'font-mono bg-surface-container-low px-2 py-0.5 rounded' : ''}`}>{item.value}</span>
                                </div>
                            ))}
                        </section>

                        <section className="bg-white rounded-xl border border-surface-variant divide-y divide-surface-variant overflow-hidden shadow-md">
                            <button className="w-full flex items-center justify-between p-4 active:bg-surface-container-low transition-colors text-left">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-primary-container" style={{ fontVariationSettings: "'FILL' 1" }}>shield</span>
                                    <span className="text-sm font-medium text-on-surface">Política de privacidade</span>
                                </div>
                                <span className="material-symbols-outlined text-on-surface-variant">chevron_right</span>
                            </button>
                            <button className="w-full flex items-center justify-between p-4 active:bg-surface-container-low transition-colors text-left">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-primary-container" style={{ fontVariationSettings: "'FILL' 1" }}>description</span>
                                    <span className="text-sm font-medium text-on-surface">Termos de uso</span>
                                </div>
                                <span className="material-symbols-outlined text-on-surface-variant">chevron_right</span>
                            </button>
                        </section>

                        <button 
                            onClick={() => navigate('/')}
                            className="w-full flex items-center justify-center gap-2 py-4 px-4 border-2 border-error rounded-xl bg-transparent active:bg-error-container/20 transition-all text-error font-bold"

                            <span className="material-symbols-outlined">logout</span>
                            <span>Sair da conta</span>
                        </button>

                        <div className="pt-4 pb-8 text-center">
                            <p className="text-[10px] text-on-surface-variant opacity-60 uppercase font-bold tracking-widest">Global Solution 2026/1 — FIAP</p>
                        </div>
                    </main>
                </Layout>
            );
        };

        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<LoginScreen />} />
                        <Route path="/register" element={<RegisterScreen />} />
                        <Route path="/home" element={<HomeScreen />} />
                        <Route path="/new-analysis" element={<NewAnalysisScreen />} />
                        <Route path="/recommendation/:id" element={<RecommendationScreen />} />
                        <Route path="/history" element={<HistoryScreen />} />
                        <Route path="/profile" element={<ProfileScreen />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
